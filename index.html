<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0c1a14">
    <title>Roulette</title>
    <style>
        :root {
            --felt: #0b6b43;
            --felt-dark: #084d31;
            --bg: #0c1512;
            --bg-2: #101e18;
            --gold: #e8c66b;
            --red: #d4213a;
            --black: #222a33;
            --green: #12a05c;
            --line: rgba(255, 255, 255, 0.18);
            --text: #f2f5f3;
            --muted: #9fb3aa;
            --cell-h: clamp(40px, 12.5vw, 64px);
            --gap-h: clamp(15px, 4.6vw, 24px);
            --edge-w: clamp(22px, 6.5vw, 34px);
            --split-w: clamp(15px, 4.6vw, 24px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body { overflow-x: hidden; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(120% 80% at 50% -10%, #163a2a 0%, transparent 60%),
                linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ---------- Top bar ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            padding-top: calc(10px + env(safe-area-inset-top));
            background: linear-gradient(180deg, #0e1c16 0%, rgba(14, 28, 22, 0.92) 100%);
            border-bottom: 1px solid rgba(232, 198, 107, 0.25);
            backdrop-filter: blur(6px);
        }
        .brand {
            font-weight: 800;
            letter-spacing: 0.5px;
            font-size: 16px;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .balance {
            text-align: right;
            line-height: 1.1;
        }
        .balance .label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
        .balance .value { font-size: 18px; font-weight: 800; color: #fff; }

        main {
            max-width: 520px;
            margin: 0 auto;
            padding: 12px 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ---------- Reel / result ---------- */
        .reel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .winning-number {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            background: #1b2a22;
            border: 3px solid var(--gold);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), inset 0 0 18px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s;
        }
        .winning-number.red { background: radial-gradient(circle at 35% 30%, #ff5468, var(--red)); }
        .winning-number.black { background: radial-gradient(circle at 35% 30%, #3a4756, var(--black)); }
        .winning-number.green { background: radial-gradient(circle at 35% 30%, #22c46f, var(--green)); }
        .winning-number.pop { transform: scale(1.12); }

        .status {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            min-height: 18px;
            font-weight: 600;
        }
        .history-strip {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 22px;
        }
        .history-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .history-dot.red { background: var(--red); }
        .history-dot.black { background: var(--black); }
        .history-dot.green { background: var(--green); }

        /* ---------- Board ---------- */
        .board {
            background: radial-gradient(130% 100% at 50% 0%, var(--felt) 0%, var(--felt-dark) 100%);
            border: 2px solid rgba(232, 198, 107, 0.5);
            border-radius: 16px;
            padding: 8px 8px 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 40px rgba(0, 0, 0, 0.25);
        }

        .table-grid {
            display: grid;
            grid-template-columns:
                var(--edge-w) minmax(0, 1fr) var(--split-w) minmax(0, 1fr) var(--split-w) minmax(0, 1fr);
            align-items: stretch;
        }

        .cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            border-radius: 7px;
            margin: 2px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.08s, box-shadow 0.12s, filter 0.12s;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        }
        .cell:active { transform: scale(0.94); }
        .cell.selected { box-shadow: 0 0 0 2px var(--gold), 0 0 12px rgba(232, 198, 107, 0.6); }
        .cell.win { animation: winpulse 0.9s ease-in-out 3; }
        @keyframes winpulse {
            0%, 100% { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
            50% { box-shadow: 0 0 0 3px #fff, 0 0 18px var(--gold); }
        }

        .cell-number { font-size: clamp(15px, 4.6vw, 22px); }
        .cell-number.red { background: linear-gradient(160deg, #e23048, var(--red)); }
        .cell-number.black { background: linear-gradient(160deg, #2c3644, var(--black)); }
        .cell-zero {
            background: linear-gradient(160deg, #17b466, var(--green));
            font-size: clamp(20px, 6vw, 30px);
        }
        .cell-column {
            background: linear-gradient(160deg, #8f5bc0, #6f3fa0);
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        /* Inside-bet spots (splits / corners / streets / six-lines) */
        .spot {
            position: relative;
            align-self: center;
            justify-self: center;
            width: 82%;
            height: 62%;
            min-width: 16px;
            min-height: 12px;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0.28;
            transition: opacity 0.12s, transform 0.08s;
        }
        .spot:active { transform: scale(0.9); }
        .spot.selected { opacity: 1; box-shadow: 0 0 0 2px var(--gold), 0 0 10px rgba(232, 198, 107, 0.7); }
        .spot-split { background: #ffffff; }
        .spot-corner { background: #2f6bff; }
        .spot-street { background: #a12ff0; }
        .spot-sixline { background: #17d06a; }
        .spot:hover { opacity: 0.55; }

        /* Chip on the table */
        .table-chip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 26px;
            height: 26px;
            padding: 0 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #10231a;
            border: 2px dashed rgba(255, 255, 255, 0.85);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 5;
        }
        .table-chip.c1 { background: #f4f4f4; color: #222; }
        .table-chip.c5 { background: #e5484d; color: #fff; }
        .table-chip.c25 { background: #2fae5f; color: #fff; }
        .table-chip.c100 { background: #2b2f36; color: #fff; }
        .table-chip.c500 { background: #7b4fc0; color: #fff; }

        /* Dozens + outside */
        .dozens, .outside {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 6px;
        }
        .bet-outside {
            padding: 12px 4px;
            min-height: 46px;
            font-size: 13px;
            text-align: center;
        }
        .bet-outside { background: linear-gradient(160deg, #12805a, #0c5f43); }
        .bet-outside.bet-red { background: linear-gradient(160deg, #e23048, var(--red)); }
        .bet-outside.bet-black { background: linear-gradient(160deg, #2c3644, var(--black)); }

        /* ---------- Tray ---------- */
        .tray {
            background: var(--bg-2);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chips {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .chip {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            border: 3px dashed rgba(255, 255, 255, 0.7);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.12s;
            color: #fff;
        }
        .chip:active { transform: scale(0.92); }
        .chip.selected { transform: translateY(-4px) scale(1.06); box-shadow: 0 0 0 3px var(--gold), 0 6px 14px rgba(0,0,0,0.5); }
        .chip.c1 { background: #d9d9d9; color: #222; }
        .chip.c5 { background: #e5484d; }
        .chip.c25 { background: #2fae5f; }
        .chip.c100 { background: #2b2f36; }
        .chip.c500 { background: #7b4fc0; }

        .total {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
        }
        .total b { color: var(--gold); font-size: 15px; }

        .actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            font-family: inherit;
            border: none;
            border-radius: 10px;
            padding: 13px 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            background: #23342b;
            cursor: pointer;
            transition: transform 0.08s, filter 0.12s, opacity 0.12s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.primary {
            grid-column: span 1;
            background: linear-gradient(160deg, #f0d488, var(--gold));
            color: #201800;
            font-weight: 800;
        }
        #spin-btn { box-shadow: 0 4px 14px rgba(232, 198, 107, 0.4); }

        /* ---------- Panel ---------- */
        .panel { display: flex; flex-direction: column; gap: 12px; }
        details.card, .results {
            background: var(--bg-2);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 12px 14px;
        }
        summary {
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: var(--gold);
            list-style: none;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: " ▾"; color: var(--muted); }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            margin-top: 12px;
            font-size: 13px;
        }
        .stat-grid div { display: flex; justify-content: space-between; color: var(--muted); }
        .stat-grid div span { color: #fff; font-weight: 700; }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 14px;
        }
        .setting-row input {
            width: 100px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #0c1512;
            color: #fff;
            font-family: inherit;
            text-align: right;
        }
        #reset-game-btn { background: #4a2530; margin-top: 12px; width: 100%; }

        .results h2 { font-size: 14px; color: var(--gold); margin-bottom: 8px; }
        #results-list { list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
        #results-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0c1512;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            border-left: 3px solid #333;
        }
        #results-list li.win { border-left-color: var(--green); }
        #results-list li.loss { border-left-color: var(--red); }
        .res-num { font-weight: 800; }
        .res-meta { color: var(--muted); font-size: 10px; }

        @media (min-width: 480px) {
            .outside { grid-template-columns: repeat(6, 1fr); }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">🎡 Roulette</div>
        <div class="balance">
            <div class="label">Balance</div>
            <div class="value">$<span id="bankroll">1000</span></div>
        </div>
    </header>

    <main>
        <section class="reel">
            <div class="winning-number" id="winning-number">–</div>
            <div class="status" id="game-status">Place your bets and spin!</div>
            <div class="history-strip" id="history-strip"></div>
        </section>

        <section class="board">
            <div class="table-grid" id="table-grid"></div>
            <div class="dozens" id="dozens"></div>
            <div class="outside" id="outside"></div>
        </section>

        <section class="tray">
            <div class="chips" id="chips"></div>
            <div class="total">Total bet: <b>$<span id="total-bet-amt">0</span></b></div>
            <div class="actions">
                <button id="undo-btn" disabled>Undo</button>
                <button id="clear-bets-btn">Clear</button>
                <button id="rebet-btn" disabled>Rebet</button>
                <button id="spin-btn" class="primary">Spin</button>
            </div>
        </section>

        <section class="panel">
            <details class="card">
                <summary>Statistics &amp; Settings</summary>
                <div class="stat-grid">
                    <div>Spins <span id="total-spins">0</span></div>
                    <div>Win rate <span id="win-rate">0%</span></div>
                    <div>Total bet <span id="total-bet">$0</span></div>
                    <div>Total won <span id="total-won">$0</span></div>
                    <div>Net P/L <span id="net-pl">$0</span></div>
                    <div>&nbsp;</div>
                </div>
                <div class="setting-row">
                    <label for="start-bankroll">Starting bankroll</label>
                    <input type="number" id="start-bankroll" min="1" value="1000">
                </div>
                <button id="reset-game-btn">Reset Game</button>
            </details>

            <div class="results">
                <h2>Recent Results</h2>
                <ul id="results-list"></ul>
            </div>
        </section>
    </main>

    <script src="game.js"></script>
</body>
</html>
